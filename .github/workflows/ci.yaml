name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # changeset status --since=main (below) needs the full history to
          # diff against origin/main; the default shallow clone only has HEAD.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catches a user-facing PR that forgot to add a .changeset/*.md entry
      # (RELEASE_STANDARD.md §1.2). Not required to pass on docs-only or
      # CI-config-only PRs; those are expected to add an empty changeset
      # (`pnpm changeset add --empty`) to satisfy this check.
      - name: Changeset status
        run: pnpm changeset status --since=main

      # Independent required gate from `pnpm verify` (TEST_STANDARD.md §1, §3).
      # `vitest run --coverage` exits non-zero on its own when any of the four
      # v8 metrics (statements/branches/functions/lines) falls below the 99%
      # thresholds set in vitest.config.ts, so no separate threshold script is
      # needed here.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
