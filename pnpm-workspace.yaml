allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  # GitHub Packages publishes mc-kernel after release; exclude it so pnpm does not delay the exact dependency.
  - '@nerima-games/mc-kernel@0.4.0 || 0.5.0 || 0.7.0 || 0.8.0 || 0.9.0 || 0.14.0'
overrides:
  # GHSA-2v37-7h3g-55p8 (high): transitive via vitest -> vite -> postcss ->
  # nanoid; custom generators can loop indefinitely when size is zero. Pinned
  # here rather than waiting on vite/postcss to bump their own dependency,
  # per the org-wide `pnpm audit` gate policy.
  nanoid: '>=3.3.18'
  # Patch transitive audit dependencies while keeping the direct Vitest and
  # Effect versions fixed.
  launch-editor: 2.14.2
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  vite: 7.3.7
  '@vitest/mocker': 4.1.12
